name: Renovate

on:
  schedule:
    # The only schedule: renovate.json has none, as GitHub can start this hours late
    # and a Renovate time window would then skip the run.
    - cron: '7 17 * * 4'
      timezone: Europe/Madrid
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: calcula las actualizaciones sin crear ramas ni PRs'
        type: boolean
        default: false
      log_level:
        description: 'Nivel de log de Renovate'
        type: choice
        options:
          - info
          - debug
          - trace
          - warn
          - error
        default: info

permissions:
  contents: read

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    name: Run Renovate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}

      - name: Run Renovate
        uses: renovatebot/github-action@ebcbb513d07ead4d9c0c2139064301db05e84a3e # v46.3.15
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: 'false'
          RENOVATE_REQUIRE_CONFIG: required
          RENOVATE_DRY_RUN: ${{ inputs.dry_run && 'full' || 'null' }}
          LOG_LEVEL: ${{ inputs.log_level || 'info' }}
        with:
          # Renovate updates this image too (its github-actions manager reads renovate-image).
          renovate-image: ghcr.io/renovatebot/renovate:44.236.2@sha256:55deecada47b7a8b1bf07218c91fd62f380d374a2b87e08570af5bfcd63c34d8
          token: ${{ steps.app-token.outputs.token }}
          env-regex: "^(?:RENOVATE_\\w+|LOG_LEVEL)$"
