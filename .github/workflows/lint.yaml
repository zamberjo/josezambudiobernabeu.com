name: Lint

on:
  pull_request:

jobs:
  lint:
    name: Lint, type-check and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Check types
        run: pnpm run check

      # Domain, use cases and adapters. The Supabase integration suite skips
      # itself here: it needs a running stack (pnpm test:db locally).
      - name: Unit tests
        run: pnpm run test:unit
