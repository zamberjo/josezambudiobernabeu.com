name: Deploy

on:
  push:
    branches:
      - master
  # Lets you redeploy the current master without pushing a commit.
  workflow_dispatch:
  # The backoffice's Publish button (packages/adapters/src/github).
  repository_dispatch:
    types: [content-published]

concurrency:
  group: deploy-hosting
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy to Firebase Hosting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check types
        run: pnpm run check

      - name: Unit tests
        run: pnpm run test:unit

      # Content comes from Supabase once its secrets exist, and from the
      # committed snapshot until then, so deploys keep working either way.
      # A repository_dispatch always builds master, whatever branch sent it.
      - name: Build
        run: pnpm run build
        env:
          CONTENT_SOURCE: ${{ secrets.SUPABASE_URL != '' && 'supabase' || 'json' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}

      - name: Deploy
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JOSEZAMBUDIOBERNABEU }}
          projectId: josezambudiobernabeu
          channelId: live
