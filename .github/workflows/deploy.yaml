name: Deploy

on:
  push:
    branches:
      - master
  # Lets you redeploy the current master without pushing a commit.
  workflow_dispatch:
  # The backoffice's Publish button (packages/adapters/src/github).
  repository_dispatch:
    types: [content-published]

concurrency:
  group: deploy-hosting
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy to Firebase Hosting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check types
        run: pnpm run check

      - name: Unit tests
        run: pnpm run test:unit

      # The same suite as on pull requests, as a gate: a red test never
      # deploys. It builds from the snapshot (playwright.config.ts), so it
      # tests the code; the build below then picks the real content source.
      - name: Install Chromium
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: Playwright
        run: pnpm run test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 14

      # Content comes from Supabase once its secrets exist, and from the
      # committed snapshot until then, so deploys keep working either way.
      # A repository_dispatch always builds master, whatever branch sent it.
      - name: Build
        run: pnpm run build
        env:
          CONTENT_SOURCE: ${{ secrets.SUPABASE_URL != '' && 'supabase' || 'json' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}

      - name: Deploy
        uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0.11.0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JOSEZAMBUDIOBERNABEU }}
          projectId: josezambudiobernabeu
          channelId: live
